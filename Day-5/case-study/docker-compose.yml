# ShopFront e-commerce observability case study stack
name: shopfront-case-study

services:
  shopfront-api:
    build: ./app
    container_name: shopfront-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://grafana:grafana@postgres:5432/demo
      TRAFFIC_RPS: "5"
      CHAOS_LATENCY_MS: "0"
      CHAOS_ERROR_RATE: "0.02"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: shopfront-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: shopfront-pg-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://grafana:grafana@postgres:5432/demo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: shopfront-node-exporter
    ports:
      - "9100:9100"
    pid: host
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopfront-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - shopfront-api
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: shopfront-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: shopfront-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_METRICS_ENABLED: "true"
    depends_on:
      - prometheus
      - postgres
      - mailhog
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  postgres-data:
