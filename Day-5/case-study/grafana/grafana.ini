[server]
http_port = 3000
root_url = http://localhost:3000/

[security]
admin_user = admin
admin_password = admin

[users]
allow_sign_up = false

[metrics]
enabled = true

[smtp]
enabled = true
host = mailhog:1025
skip_verify = true
from_address = grafana@shopfront.lab
from_name = ShopFront Grafana
ehlo_identity = grafana.shopfront.lab

[unified_alerting]
enabled = true

[alerting]
enabled = false
