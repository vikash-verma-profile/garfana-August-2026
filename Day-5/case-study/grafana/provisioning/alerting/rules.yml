apiVersion: 1

groups:
  - orgId: 1
    name: shopfront-checkout
    folder: ShopFront
    interval: 1m
    rules:
      - uid: shopfront-checkout-p95
        title: ShopFrontCheckoutP95High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{route="/api/checkout"}[5m])
                  )
                )
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Checkout p95 latency is above 500ms
          description: ShopFront checkout p95 exceeded the 500ms SLO. Check /chaos settings, DB health, and recent deploys.
          runbook_url: https://example.com/runbooks/shopfront-checkout-latency
        labels:
          severity: critical
          team: checkout
          service: shopfront
