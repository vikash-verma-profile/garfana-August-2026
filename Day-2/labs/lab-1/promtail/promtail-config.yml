server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Ship demo-api container logs with job="node" for Lab 1 LogQL:
  #   {job="node"}
  - job_name: demo-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["demo-api"]
    relabel_configs:
      - target_label: job
        replacement: node
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - replacement: demo-api
        target_label: service_name
    pipeline_stages:
      - docker: {}
