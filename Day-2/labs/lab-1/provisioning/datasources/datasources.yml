apiVersion: 1

# Optional pre-provision. Lab STEPS still walk you through adding these in the UI.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana
    editable: true
    jsonData:
      database: demo
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: grafana

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
