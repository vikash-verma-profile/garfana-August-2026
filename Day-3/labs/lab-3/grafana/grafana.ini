##################### Grafana Configuration #####################
# Lab SMTP → MailHog (UI http://localhost:8025)

[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[users]
allow_sign_up = false

[smtp]
enabled = true
host = mailhog:1025
user =
password =
cert_file =
key_file =
skip_verify = true
from_address = grafana@lab.local
from_name = Grafana Lab
ehlo_identity = grafana.lab.local
startTLS_policy =

[unified_alerting]
enabled = true

[alerting]
enabled = false
