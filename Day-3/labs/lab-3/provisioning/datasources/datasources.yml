apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Manage alerts in Grafana Unified Alerting (not Prometheus Alertmanager for this lab)
      manageAlerts: true
